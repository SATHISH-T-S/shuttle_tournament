<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<title>Badminton Tournament Scorer</title>
<style>
:root{--bg:#f3f6f1;--card:#fff;--ink:#14281d;--mute:#5d6f64;--line:#d9e2da;--court:#0f5132;--court2:#1b7a4b;--shuttle:#f2c230;--red:#c0392b;--blue:#2166b0}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a13;--card:#16261c;--ink:#e8f0ea;--mute:#9bb0a2;--line:#2a4032;--court:#2e9e68;--court2:#3cb97c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.45}
header{background:#0f5132;color:#fff;padding:18px 16px 0;border-bottom:4px solid var(--shuttle)}
header h1{margin:0 0 2px;font-size:1.5rem;letter-spacing:.3px}
header p{margin:0 0 12px;opacity:.8;font-size:.9rem}
nav{display:flex;gap:4px;max-width:960px;margin:0 auto}
nav button{flex:1;background:transparent;color:#cfe6d8;border:0;padding:12px 6px;font:inherit;font-weight:700;cursor:pointer;border-radius:10px 10px 0 0}
nav button.on{background:var(--bg);color:var(--court)}
.wrap{max-width:960px;margin:0 auto}
main{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:1.15rem}
h3{margin:14px 0 8px;font-size:1rem;color:var(--mute)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--shuttle);outline-offset:1px}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--court);color:#fff}
.btn.alt{background:transparent;color:var(--court);border:1px solid var(--court)}
.btn.del{background:transparent;color:var(--red);border:1px solid var(--red);padding:7px 10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>input{flex:1 1 140px}
.team{display:grid;grid-template-columns:34px 1.3fr 1fr 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.team:first-of-type{border-top:0}
.team .n{font-weight:800;color:var(--mute);text-align:center}
.team input{width:100%}

.mode{display:flex;gap:10px;flex-wrap:wrap}
.mode label{flex:1 1 200px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.mode input{display:none}
.mode label.sel{border-color:var(--court);background:color-mix(in srgb,var(--court) 10%,transparent)}
.mode b{display:block}.mode span{font-size:.85rem;color:var(--mute)}
.m{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--card)}
.m.live{border-color:var(--shuttle);box-shadow:0 0 0 2px var(--shuttle)}
.mh{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mute);margin-bottom:8px;gap:8px;flex-wrap:wrap}
.tag{padding:2px 8px;border-radius:99px;font-weight:700;font-size:.75rem;background:var(--line);color:var(--ink)}
.tag.live{background:var(--shuttle);color:#3a2e00}.tag.done{background:var(--court);color:#fff}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.side{text-align:center}
.side .nm{font-weight:800}.side .pl{font-size:.8rem;color:var(--mute)}
.side.win .nm::after{content:" 🏆"}
.sc{font-size:2.6rem;font-weight:900;line-height:1;margin:6px 0;font-variant-numeric:tabular-nums}
.side.a .sc{color:var(--red)}.side.b .sc{color:var(--blue)}
.ctl{display:flex;gap:6px;justify-content:center}
.ctl button{width:46px;height:40px;font-size:1.3rem;font-weight:800;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.ctl button.p{background:var(--court);color:#fff;border-color:var(--court)}
.mid{font-weight:800;color:var(--mute)}
.hope{display:inline-block;background:var(--shuttle);color:#3a2e00;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:99px;margin-top:4px}
.gl{margin-top:10px;font-size:.85rem;color:var(--mute);text-align:center}
.act{margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.empty{text-align:center;color:var(--mute);padding:24px 8px}
.champ{background:linear-gradient(90deg,#f2c230,#ffe08a);color:#3a2e00;text-align:center;font-size:1.2rem;font-weight:900;padding:14px;border-radius:12px;margin-bottom:14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:.8rem;color:var(--mute)}
td.l,th.l{text-align:left}
tbody tr:nth-child(1) td:first-child{background:var(--shuttle);color:#3a2e00;font-weight:900}
.pos{color:var(--court);font-weight:700}.neg{color:var(--red);font-weight:700}
.note{font-size:.8rem;color:var(--mute);margin-top:8px}
.bar{background:var(--shuttle);color:#3a2e00;border-radius:12px;padding:14px;margin-bottom:14px;display:grid;gap:6px}
.bar .btn{background:#14281d;color:#fff}.bar .btn.alt{background:transparent;color:#3a2e00;border:1px solid #3a2e00}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal[hidden]{display:none}.modal .box{background:var(--card);border-radius:14px;padding:20px;max-width:380px;width:100%}
.modal .row{flex-direction:column;align-items:stretch}.modal .row .btn{width:100%}
.fld{display:grid;gap:4px;font-size:.8rem;color:var(--mute);flex:1 1 130px}.fld input{width:100%}
.paid{display:flex;gap:6px;align-items:center;font-weight:700;font-size:.85rem}.paid input{width:auto}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select{font-size:16px}
@media(max-width:720px){
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  header{padding:12px 14px 12px;padding-top:calc(12px + env(safe-area-inset-top))}
  header h1{font-size:1.2rem}header p{margin:0;font-size:.8rem}
  nav{position:fixed;left:0;right:0;bottom:0;max-width:none;margin:0;gap:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:50;box-shadow:0 -2px 10px rgba(0,0,0,.12)}
  nav button{color:var(--mute);border-radius:0;padding:12px 4px;font-size:.9rem;min-height:56px;border-top:3px solid transparent}
  nav button.on{background:transparent;color:var(--court);border-top-color:var(--shuttle)}
  main{padding:12px}
  .card{padding:12px}
  .btn{min-height:46px;padding:10px 14px}
  input,select{min-height:46px}
  .card .row>input,.card .row>select{flex:1 1 100%}
  .card .row>.btn{flex:1 1 100%}
  .fld{flex:1 1 100%}
  .team{grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
  .team:first-of-type{border-top:1px solid var(--line)}
  .team .n{grid-column:1/3;text-align:left}
  .team input:nth-of-type(1){grid-column:1/3}
  .team .paid{min-height:46px}
  .team .del{min-height:46px}
  .m{padding:10px}
  .sc{font-size:3.2rem}
  .side .nm{font-size:.95rem;word-break:break-word}
  .ctl button{width:70px;height:54px;font-size:1.6rem}
  .ctl button.p{width:84px}
  .act .btn{flex:1 1 40%}
  .bar .row .btn{flex:1 1 100%}
  table{min-width:640px}
  th.l,td.l{position:sticky;left:0;background:var(--card);box-shadow:1px 0 0 var(--line);min-width:110px}
  .champ{font-size:1rem}
}
.modal .box{max-height:92vh;overflow:auto}.fld select{width:100%}.box .fld{margin-bottom:10px}
.edr{display:grid;grid-template-columns:64px 1fr 14px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.edr input{width:100%;text-align:center;font-size:1.3rem;font-weight:800}
.edact{display:grid;gap:8px;margin-top:12px}
table input.adj{width:64px;min-height:38px;padding:4px;text-align:center}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin:2px;font-size:.8rem}
.won{background:var(--court);color:#fff;text-align:center;padding:10px;border-radius:10px;font-weight:800;margin-top:10px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem}
nav button b{font-size:1.15rem;font-weight:400;line-height:1}
@media(max-width:720px){nav button{padding:8px 2px;font-size:.72rem}}
.sc.word{font-size:2.1rem;padding:.3rem 0}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 id="ttl">🏸 Badminton Tournament Scorer</h1>
    <p>Teams of 2 · 14 points a game · 13 is Hope Point</p>
    <nav id="nav">
      <button data-t="teams" class="on"><b>👥</b>Teams</button>
      <button data-t="score"><b>🏸</b>Score</button>
      <button data-t="upcoming"><b>📅</b>Upcoming</button>
      <button data-t="results"><b>✅</b>Results</button>
      <button data-t="table"><b>📊</b>Points</button>
    </nav>
  </div>
</header>
<main id="app"></main>
<div id="edm" class="modal" hidden><div class="box" id="edbox"></div></div>
<div id="modal" class="modal" hidden><div class="box"><h2>Tournament in progress</h2>
<p>The page was refreshed. What do you want to do?</p>
<div class="row"><button class="btn" onclick="closeModal()">Continue (keep scores)</button>
<button class="btn alt" onclick="reshuffle()">Reshuffle the matches</button>
<button class="btn del" onclick="exitTournament()">Exit tournament</button></div>
<p class="note">Reshuffle: same teams, new fixtures, scores cleared.<br>Exit: back to the Shuffle &amp; start page, scores cleared, teams kept.</p></div></div>

<script>
const MAX=14, KEY='bt_state_v1';
let S=load(), tab='teams';
function load(){
  const c=[];
  try{c.push(JSON.parse(localStorage.getItem(KEY)))}catch(e){}
  try{c.push(JSON.parse(sessionStorage.getItem(KEY)))}catch(e){}
  try{if(window.name.indexOf('BT:')===0)c.push(JSON.parse(window.name.slice(3)))}catch(e){}
  const s=c.filter(Boolean).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
  if(s){s.waiting=s.waiting||[];s.bestOf=s.bestOf||1;s.perTeam=s.perTeam||0;s.fee=s.fee??300;s.p1=s.p1??2000;s.p2=s.p2??1000;return s}
  return {teams:[],mode:'league',bestOf:1,started:false,matches:[],waiting:[],fee:300,p1:2000,p2:1000}}
function save(){
  S.ts=Date.now();const j=JSON.stringify(S);
  try{localStorage.setItem(KEY,j)}catch(e){}
  try{sessionStorage.setItem(KEY,j)}catch(e){}
  try{window.name='BT:'+j}catch(e){}
}
window.addEventListener('pagehide',()=>{try{save()}catch(e){}});
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=id=>S.teams.find(t=>t.id===id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const need=()=>S.bestOf===3?2:1;
const SHUT=7;
const pt=n=>n===0?'Love':n===13?'Hope':n===14?'Game':n;
function gwin(g){
  if(g[0]>=MAX||(g[0]>=SHUT&&g[1]===0))return 0;
  if(g[1]>=MAX||(g[1]>=SHUT&&g[0]===0))return 1;
  return -1;
}
function undoGame(g){const w=gwin(g);if(w>=0)g[w]=g[1-w]===0?SHUT-1:MAX-1}
/* order matches so a team does not play two matches in a row */
function spread(list,hist){
  const seq=[...(hist||[])],left=[...list],out=[];
  while(left.length){
    const last={};seq.forEach((o,k)=>{last[o.a]=k;last[o.b]=k});
    const gap=t=>last[t]===undefined?50:seq.length-last[t];
    let best=0,bs=-1;
    left.forEach((m,i)=>{const ga=gap(m.a),gb=gap(m.b),sc=Math.min(ga,gb)*1000+(ga+gb)*10+Math.random();if(sc>bs){bs=sc;best=i}});
    const [m]=left.splice(best,1);seq.push(m);out.push(m);
  }
  return out;
}
function roundName(r){const c=S.matches.filter(m=>m.round===r).length;return c===1?'Final':c===2?'Semi-finals':c===4?'Quarter-finals':'Round '+r}

/* ---------- Teams ---------- */
function addTeam(){
  const n=document.getElementById('tn').value.trim(),p1=document.getElementById('p1').value.trim(),p2=document.getElementById('p2').value.trim();
  if(!n||!p1||!p2){alert('Enter team name and both player names.');return}
  const t={id:uid(),name:n,p1,p2};S.teams.push(t);if(S.started)joinLate(t);save();render();
  setTimeout(()=>document.getElementById('tn').focus(),0);
}
function editTeam(id,f,v){const t=T(id);if(t){t[f]=v.trim()||t[f];save()}}
function joinLate(t){
  const others=S.teams.filter(x=>x.id!==t.id&&!x.out);
  if(S.mode==='league'){
    S.matches=S.matches.filter(m=>!m.po||m.done||m.games.some(g=>g[0]+g[1]>0));
    const pick=S.perTeam&&S.perTeam<others.length?shuffle(others).slice(0,S.perTeam):others;
    const nm=pick.map(o=>({id:uid(),round:1,a:t.id,b:o.id,games:[[0,0]],done:false,winner:null}));
    const keep=S.matches.filter(m=>m.done||m.confirmed||m.games.some(g=>g[0]+g[1]>0));
    const up=S.matches.filter(m=>!keep.includes(m));
    S.matches=[...keep,...spread([...up,...nm],keep)];
  }else{
    S.waiting.push(t.id);
    if(S.waiting.length>=2){
      const last=Math.max(...S.matches.map(m=>m.round));
      const [a,b]=S.waiting.splice(0,2);
      S.matches.push({id:uid(),round:last,a,b,games:[[0,0]],done:false,winner:null});
    }
    advance();
  }
}
function delTeam(id){
  const t=T(id);if(!t)return;
  if(!S.started){if(confirm('Remove this team?')){S.teams=S.teams.filter(x=>x.id!==id);save();render()}return}
  if(!confirm('Withdraw this team? Their unfinished matches will be removed.'))return;
  t.out=true;S.waiting=S.waiting.filter(x=>x!==id);
  if(S.mode==='league')S.matches=S.matches.filter(m=>m.done||m.bye||(m.a!==id&&m.b!==id));
  else{
    S.matches.forEach(m=>{if(!m.done&&(m.a===id||m.b===id)){const o=m.a===id?m.b:m.a;m.a=o;m.b=null;m.bye=true;m.done=true;m.winner=o;m.games=[]}});
    advance();
  }
  save();render();
}
function liveBar(m){
  const a=T(m.a),b=T(m.b);
  return `<div class="bar"><b>Match in progress: ${esc(a.name)} vs ${esc(b.name)}</b><div>Finish this match in Score. Then start the next one.</div><div class="row"><button class="btn" onclick="tab='score';render();window.scrollTo(0,0)">Go to Score</button></div></div>`;
}
function nextBar(){
  const m=S.matches.find(x=>!x.done&&!x.bye&&!x.confirmed&&!x.games.some(g=>g[0]+g[1]>0));
  if(!m)return'';
  const a=T(m.a),b=T(m.b);
  return `<div class="bar"><b>Next match: ${esc(a.name)} vs ${esc(b.name)}</b>
  <div>${esc(a.p1)} &amp; ${esc(a.p2)} · ${esc(b.p1)} &amp; ${esc(b.p2)}</div>
  <div>Have both teams come? Shall we start?</div>
  <div class="row"><button class="btn" onclick="confirmM('${m.id}')">Yes, start</button><button class="btn alt" onclick="later('${m.id}')">No, play at last</button></div></div>`;
}
function confirmM(id){S.matches.find(x=>x.id===id).confirmed=true;tab='score';save();render();window.scrollTo(0,0)}
function later(id){const i=S.matches.findIndex(x=>x.id===id);const[m]=S.matches.splice(i,1);S.matches.push(m);save();render()}
function goAdd(){tab='teams';render();setTimeout(()=>document.getElementById('tn').focus(),0)}
function closeModal(){document.getElementById('modal').hidden=true}
function reshuffle(){
  if(!confirm('Reshuffle will clear all scores and make new fixtures with the same teams. Continue?'))return;
  S.started=false;S.matches=[];S.waiting=[];S.teams=S.teams.filter(t=>!t.out);closeModal();startTournament();
}
function exitTournament(){if(confirm('Exit the tournament? Scores and fixtures will be cleared. Teams are kept.'))exitToSetup()}
function exitToSetup(){S.started=false;S.matches=[];S.waiting=[];S.teams=S.teams.filter(t=>!t.out);save();tab='teams';closeModal();render()}
function setMode(m){if(S.started)return;S.mode=m;save();render()}
function setBest(v){if(S.started)return;S.bestOf=+v;save()}
function moneySum(){
  const n=S.teams.length,paid=S.teams.filter(t=>t.paid).length;
  const exp=n*S.fee,col=paid*S.fee,pr=S.p1+S.p2;
  return `<p class="note">Teams: ${n} · Fee to collect: ₹${exp} · Collected (${paid} paid): ₹${col} · Pending: ₹${exp-col}</p>
  <p class="note">Prizes: ₹${S.p1} + ₹${S.p2} = ₹${pr} · Balance after prizes (collected − prizes): <b class="${col-pr>=0?'pos':'neg'}">₹${col-pr}</b></p>`;
}
function setMoney(k,v){S[k]=Math.max(0,parseInt(v,10)||0);save();const e=document.getElementById('msum');if(e)e.innerHTML=moneySum()}
function setPaid(id,v){const t=T(id);if(t){t.paid=v;save();const e=document.getElementById('msum');if(e)e.innerHTML=moneySum()}}
function moneyCard(){
  const f=(k,l)=>`<label class="fld">${l}<input type="number" min="0" inputmode="numeric" value="${S[k]}" oninput="setMoney('${k}',this.value)"></label>`;
  return `<div class="card"><h2>Entry fee &amp; prizes</h2><p class="note" style="margin:0 0 8px">Tap any amount to change it. It saves and updates instantly, even after the tournament starts.</p>
  <div class="row">${f('fee','Entry fee per team (₹)')}${f('p1','1st prize (₹)')}${f('p2','2nd prize (₹)')}</div>
  <div id="msum">${moneySum()}</div><p class="note">Tick "Paid" on each team when the fee is received.</p></div>`;
}
function result(){
  if(S.mode==='league'){const f0=S.matches.find(m=>m.po==='final');if(f0)return f0.done?[T(f0.winner),T(f0.winner===f0.a?f0.b:f0.a)]:null}
  if(!S.started||!S.matches.length||S.waiting.length||S.matches.some(m=>!m.done))return null;
  if(S.mode==='knockout'){
    const c=champion();if(!c)return null;
    const last=Math.max(...S.matches.map(m=>m.round)),f=S.matches.find(m=>m.round===last);
    return [c,T(f.winner===f.a?f.b:f.a)];
  }
  const f=S.matches.find(m=>m.po==='final');
  if(f){if(!f.done)return null;return [T(f.winner),T(f.winner===f.a?f.b:f.a)]}
  const st=standings();return [st[0].t,st[1]?st[1].t:null];
}
function prizeBanner(){
  const r=result();if(!r)return'';
  const line=(md,t,amt)=>t?`<div>${md} ${esc(t.name)} (${esc(t.p1)} &amp; ${esc(t.p2)}) wins ₹${amt}</div>`:'';
  return `<div class="champ">${line('🥇',r[0],S.p1)}${line('🥈',r[1],S.p2)}</div>`;
}
function setTitle(v){S.title=v;save();const t=document.getElementById('ttl');if(t)t.textContent='🏸 '+(v||'Badminton Tournament Scorer')}
function setAdj(id,v){const t=T(id);if(t){t.adj=parseInt(v,10)||0;save();render()}}
let EID=null;
function teamOpts(sel){return S.teams.filter(t=>!t.out||t.id===sel).map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.name)} (${esc(t.p1)} &amp; ${esc(t.p2)})</option>`).join('')}
function openEdit(id){
  const m=id?S.matches.find(x=>x.id===id):null;
  if(!m&&S.teams.length<2){alert('Add at least 2 teams first.');return}
  EID=id;
  const act=S.teams.filter(t=>!t.out);
  const a=m?m.a:act[0].id,b=m?m.b:act[1].id;
  const ng=S.bestOf===3?3:1;let rows='';
  for(let i=0;i<ng;i++){
    const g=(m&&m.games[i])||[0,0];
    rows+=`<div class="edr"><span>${ng>1?'Game '+(i+1):'Score'}</span><input type="number" inputmode="numeric" min="0" max="14" id="ea${i}" value="${g[0]}"><b>-</b><input type="number" inputmode="numeric" min="0" max="14" id="eb${i}" value="${g[1]}"></div>`;
  }
  document.getElementById('edbox').innerHTML=`<h2>${m?'Edit match':'Add match'}</h2>
  <label class="fld">Team A<select id="eta">${teamOpts(a)}</select></label>
  <label class="fld">Team B<select id="etb">${teamOpts(b)}</select></label>
  <h3>Points (0 to 14)</h3>${rows}
  <p class="note">First to 14 wins. A team on 7 while the other is on 0 (Love) also wins. Leave 0-0 for a match not played yet. Team names and players are edited on the Teams page.</p>
  <div class="edact"><button class="btn" onclick="saveEdit()">Save</button><button class="btn alt" onclick="closeEd()">Cancel</button>${m?'<button class="btn del" onclick="delMatch()">Delete match</button>':''}</div>`;
  document.getElementById('edm').hidden=false;
}
function closeEd(){document.getElementById('edm').hidden=true}
function saveEdit(){
  const a=document.getElementById('eta').value,b=document.getElementById('etb').value;
  if(a===b){alert('Pick two different teams.');return}
  const ng=S.bestOf===3?3:1,rows=[];
  for(let i=0;i<ng;i++){
    const x=parseInt(document.getElementById('ea'+i).value,10)||0,y=parseInt(document.getElementById('eb'+i).value,10)||0;
    if(x<0||y<0||x>MAX||y>MAX||(x===MAX&&y===MAX)){alert('Scores must be 0 to 14, and both teams cannot have 14.');return}
    rows.push([x,y]);
  }
  let last=-1;rows.forEach((r,i)=>{if(r[0]+r[1]>0)last=i});
  for(let i=0;i<last;i++)if(gwin(rows[i])<0){alert('Game '+(i+1)+' must be finished (one team on 14) before the next game.');return}
  const games=[];let wa=0,wb=0,done=false,winner=null;
  for(const r of rows){
    if(r[0]+r[1]===0)break;
    games.push(r);
    {const gw=gwin(r);if(gw===0)wa++;else if(gw===1)wb++}
    if(wa>=need()||wb>=need()){done=true;winner=wa>=need()?a:b;break}
  }
  if(!done&&!games.length)games.push([0,0])
  let m=EID?S.matches.find(x=>x.id===EID):null;
  if(m&&S.mode==='knockout'&&S.matches.some(x=>x.round>m.round)&&(m.a!==a||m.b!==b||m.winner!==winner)){alert('The next round has already started. Reset fixtures to change this result.');return}
  if(!m){m={id:uid(),round:S.mode==='knockout'?Math.max(1,...S.matches.map(x=>x.round)):1};S.matches.push(m)}
  const any=games.some(g=>g[0]+g[1]>0);
  Object.assign(m,{a,b,games,done,winner,bye:false,confirmed:m.confirmed||any});
  advance();save();closeEd();render();
}
function delMatch(){
  const m=S.matches.find(x=>x.id===EID);if(!m)return;
  if(S.mode==='knockout'&&S.matches.some(x=>x.round>m.round)){alert('The next round has already started.');return}
  if(!confirm('Delete this match?'))return;
  S.matches=S.matches.filter(x=>x.id!==EID);advance();save();closeEd();render();
}
function setPer(v){if(S.started)return;S.perTeam=+v;save()}
function perSel(lock){
  const n=S.teams.length;if(n<2)return'<p class="note">Add teams to see the match options.</p>';
  let o='';
  for(let k=1;k<=Math.min(n-2,6);k++)o+=`<option value="${k}" ${S.perTeam===k?'selected':''}>Each team plays ${k} match${k>1?'es':''}</option>`;
  o+=`<option value="0" ${!S.perTeam||S.perTeam>=n-1?'selected':''}>Full league (each team plays ${n-1})</option>`;
  return `<div class="row" style="margin-top:12px"><label for="pt">Matches per team</label><select id="pt" onchange="setPer(this.value)" ${lock?'disabled':''}>${o}</select></div>`;
}

/* ---------- Fixtures ---------- */
function makeRound(ids,round,hist){
  const q=shuffle(ids),out=[];
  if(q.length%2){out.push({id:uid(),round,a:q.pop(),b:null,games:[],done:true,winner:null,bye:true});out[0].winner=out[0].a}
  for(let i=0;i<q.length;i+=2)out.push({id:uid(),round,a:q[i],b:q[i+1],games:[[0,0]],done:false,winner:null});
  return [...out.filter(m=>m.bye),...spread(out.filter(m=>!m.bye),hist||[])];
}
function startTournament(){
  if(S.teams.length<2){alert('Add at least 2 teams.');return}
  if(S.started){if(!confirm('Reshuffle will clear all scores and make new fixtures with all current teams. Continue?'))return;S.waiting=[];S.teams=S.teams.filter(t=>!t.out)}
  const ids=S.teams.map(t=>t.id);
  if(S.mode==='league'){
    const n=ids.length,k=(S.perTeam&&S.perTeam<n-1)?S.perTeam:n-1;
    const t=shuffle(ids);if(t.length%2)t.push(null);
    const N=t.length,list=[];
    const full=!(S.perTeam&&S.perTeam<n-1);
    for(let r=0;r<(full?N-1:k);r++){
      for(let i=0;i<N/2;i++){const a=t[i],b=t[N-1-i];if(a&&b)list.push({id:uid(),round:1,a,b,games:[[0,0]],done:false,winner:null})}
      t.splice(1,0,t.pop());
    }
    S.matches=spread(list);
  }else S.matches=makeRound(ids,1);
  S.started=true;S.lastDone=null;save();tab='upcoming';render();
}
function resetAll(){
  if(!confirm('Reset all scores and fixtures? Teams are kept.'))return;
  S.started=false;S.matches=[];S.waiting=[];S.teams=S.teams.filter(t=>!t.out);save();tab='teams';render();
}
function clearAll(){if(confirm('Delete EVERYTHING including teams?')){S={teams:[],mode:'league',bestOf:1,started:false,matches:[],waiting:[],fee:300,p1:2000,p2:1000};save();tab='teams';render()}}
function mkPo(a,b,po){return{id:uid(),round:po==='semi'?2:3,po,a,b,games:[[0,0]],done:false,winner:null}}
function playoffAdvance(force){
  if(S.playoff===false&&!force)return;
  const lg=S.matches.filter(m=>!m.po);
  const po=S.matches.filter(m=>m.po);
  if(!po.length){
    if(!force&&(!lg.length||!lg.every(m=>m.done)))return;
    const top=standings().filter(x=>!x.t.out).map(x=>x.t.id);
    if(top.length>=4)S.matches.push(mkPo(top[0],top[3],'semi'),mkPo(top[1],top[2],'semi'));
    else if(top.length===3)S.matches.push(mkPo(top[0],top[1],'final'));
    return;
  }
  const sf=po.filter(m=>m.po==='semi');
  if(sf.length===2&&sf.every(m=>m.done)&&!po.some(m=>m.po==='final'))S.matches.push(mkPo(sf[0].winner,sf[1].winner,'final'));
}
function moveToSemi(){
  if(S.mode!=='league'||!S.started)return;
  const pend=S.matches.filter(m=>!m.po&&!m.done).length,ex=S.matches.some(m=>m.po);
  if(!confirm((ex?'This replaces the current semi-finals and final. ':'')+(pend?pend+' league match(es) are not finished yet. ':'')+'Move the top teams of the points table to the semi-final?'))return;
  S.matches=S.matches.filter(m=>!m.po);
  playoffAdvance(true);
  if(!S.matches.some(m=>m.po)){alert('At least 3 teams are needed.');return}
  save();tab='upcoming';render();window.scrollTo(0,0);
}
function semiBtn(){
  if(S.mode!=='league'||!S.started||S.teams.filter(t=>!t.out).length<3)return'';
  const ex=S.matches.some(m=>m.po);
  return `<div class="row" style="margin-top:12px"><button class="btn" onclick="moveToSemi()">➡️ ${ex?'Re-pick Semi-final from this table':'Move to Semi-final'}</button></div><p class="note">Takes the top 4 teams from this table: 1st vs 4th and 2nd vs 3rd. With 3 teams, the top 2 play the Final.</p>`;
}
function redoPlayoffs(){
  if(!confirm('Remove the semi-finals and final and pick them again from the current points table?'))return;
  S.matches=S.matches.filter(m=>!m.po);playoffAdvance();save();render();
}
function setPlay(v){S.playoff=v;if(S.started)advance();save();render()}
function playSel(){return `<label class="paid" style="margin-top:12px"><input type="checkbox" ${S.playoff!==false?'checked':''} onchange="setPlay(this.checked)"> Semi-final &amp; Final after the league (top 4 from the points table)</label>`}
function advance(){
  if(S.mode==='league'){playoffAdvance();return}
  if(S.mode!=='knockout'||!S.matches.length)return;
  const last=Math.max(...S.matches.map(m=>m.round));
  const r=S.matches.filter(m=>m.round===last);
  if(!r.every(m=>m.done))return;
  const w=r.map(m=>m.winner).filter(Boolean).concat(S.waiting);
  if(w.length>1){S.waiting=[];S.matches.push(...makeRound(w,last+1,r.filter(m=>!m.bye)))}
}
const champion=()=>{
  if(S.mode!=='knockout'||!S.matches.length)return null;
  const last=Math.max(...S.matches.map(m=>m.round)),r=S.matches.filter(m=>m.round===last);
  return r.length===1&&r[0].done&&!S.waiting.length?T(r[0].winner):null;
};

/* ---------- Scoring ---------- */
function gamesWon(m){let a=0,b=0;m.games.forEach(g=>{const w=gwin(g);if(w===0)a++;else if(w===1)b++});return[a,b]}
function score(id,side,d){
  const m=S.matches.find(x=>x.id===id);if(!m||m.done)return;
  const g=m.games[m.games.length-1];
  if(gwin(g)>=0)return;
  g[side]=Math.max(0,Math.min(MAX,g[side]+d));
  const gw=gwin(g);
  if(gw>=0){
    const w=gamesWon(m);
    if(w[gw]>=need()){m.done=true;m.winner=gw?m.b:m.a;S.lastDone=m.id;advance()}
  }
  save();render();
}
function reopen(id){
  const m=S.matches.find(x=>x.id===id);
  if(S.matches.some(x=>x.round>m.round)){alert('Next round already started. Reset to change this result.');return}
  m.done=false;m.winner=null;
  const g=m.games[m.games.length-1];
  undoGame(g);
  save();render();
}
function resetMatch(id){
  const m=S.matches.find(x=>x.id===id);
  if(S.matches.some(x=>x.round>m.round)){alert('Next round already started.');return}
  if(!confirm('Clear scores of this match?'))return;
  m.games=[[0,0]];m.done=false;m.winner=null;save();render();
}

/* ---------- Points table ---------- */
function standings(){
  const r={};S.teams.forEach(t=>r[t.id]={t,P:0,W:0,L:0,PF:0,PA:0,G:0});
  S.matches.forEach(m=>{
    if(m.bye||!m.done||m.po)return;
    [[m.a,0],[m.b,1]].forEach(([id,s])=>{
      const x=r[id];if(!x)return;
      x.P++;m.winner===id?x.W++:x.L++;
      m.games.forEach(g=>{if(g[0]+g[1]===0)return;x.PF+=g[s];x.PA+=g[1-s];x.G++});
    });
  });
  return Object.values(r).map(x=>({...x,PD:x.PF-x.PA,RR:x.G?(x.PF-x.PA)/x.G:0,Pts:x.W*2+(x.t.adj||0)}))
    .sort((a,b)=>b.Pts-a.Pts||b.RR-a.RR||b.PD-a.PD||b.PF-a.PF);
}

/* ---------- Views ---------- */
function vTeams(){
  const lock=S.started;
  let h=`<div class="card"><h2>Tournament name</h2><input style="width:100%" value="${esc(S.title||'')}" placeholder="Badminton Tournament Scorer" oninput="setTitle(this.value)"></div><div class="card"><h2>Add team</h2>
  <div class="row"><input id="tn" placeholder="Team name">
  <input id="p1" placeholder="Player 1">

  <button class="btn" onclick="addTeam()">Add team</button></div>
  ${lock?'<p class="note">Tournament is running. A new team is added to the fixtures automatically (League: plays everyone. Knockout: joins the current round).</p>':''}</div>`;
  h+=`<div class="card"><h2>Teams (${S.teams.length})</h2>`;

    <label class="paid"><input type="checkbox" ${t.paid?'checked':''} onchange="setPaid('${t.id}',this.checked)"> Paid</label><button class="btn del" onclick="delTeam('${t.id}')" ${t.out?'disabled':''}>${t.out?'Withdrawn':lock?'Withdraw':'Remove'}</button></div>`;
  });
  h+=`</div>`;
  h+=moneyCard()+`<div class="card"><h2>Tournament type</h2><div class="mode">
  <label class="${S.mode==='league'?'sel':''}"><input type="radio" name="md" onclick="setMode('league')"><b>League match</b><span>Every team plays every other team. Fixtures are shuffled.</span></label>
  <label class="${S.mode==='knockout'?'sel':''}"><input type="radio" name="md" onclick="setMode('knockout')"><b>Knockout match</b><span>Random draw. Lose and you are out. Odd teams get a bye.</span></label></div>
  ${S.mode==='league'?perSel(lock)+playSel():''}
  <div class="row" style="margin-top:12px"><label for="bo">Games in each match</label>
  <select id="bo" onchange="setBest(this.value)" ${lock?'disabled':''}>
  <option value="1" ${S.bestOf===1?'selected':''}>1 game (first to 14 wins)</option>
  <option value="3" ${S.bestOf===3?'selected':''}>Best of 3 (first to win 2 games)</option></select></div>
  <div class="row" style="margin-top:14px">
  <button class="btn" onclick="startTournament()">${lock?'Reshuffle all matches':'Shuffle &amp; start'}</button>
  <button class="btn alt" onclick="resetAll()" ${lock?'':'disabled'}>Reset fixtures</button>
  <button class="btn del" onclick="clearAll()">Delete everything</button></div></div>`;
  return h;
}
function lbl(m){return S.mode==='knockout'?roundName(m.round):m.po?(m.po==='final'?'Final':'Semi-final'):'Match '+(S.matches.indexOf(m)+1)}
function card(m,ctx){
  if(m.bye){const t=T(m.a);return `<div class="m"><div class="mh"><span>${roundName(m.round)}</span><span class="tag">Bye</span></div><b>${esc(t.name)}</b> goes straight to the next round.</div>`}
  const a=T(m.a),b=T(m.b);if(!a||!b)return'';
  const started=m.games.some(x=>x[0]+x[1]>0),n=m.games.length,g=m.games[n-1];
  const between=!m.done&&gwin(g)>=0,w=gamesWon(m),live=started||m.confirmed;
  const tag=m.done?'Completed':live?'Live':'Upcoming',tc=m.done?'done':live?'live':'';
  const head=`<div class="mh"><span>${lbl(m)}${S.bestOf===3&&ctx!=='up'?' · Games won '+w[0]+'-'+w[1]:''}</span><span class="tag ${tc}">${tag}</span></div>`;
  const side=(t,s,cls,mid)=>`<div class="side ${cls} ${m.done&&m.winner===t.id?'win':''}"><div class="nm">${esc(t.name)}</div><div class="pl">${esc(t.p1)} &amp; ${esc(t.p2)}</div>${mid}</div>`;
  const chips=(all)=>{const list=m.games.filter((x,i)=>(x[0]+x[1]>0)&&(all||i<n-1||between||m.done));return S.bestOf===3&&list.length?`<div class="gl">${list.map((x,i)=>`<span class="chip">Game ${i+1}: ${x[0]}–${x[1]}</span>`).join('')}</div>`:''};
  if(ctx==='up')return `<div class="m">${head}<div class="vs">${side(a,0,'a','')}<div class="mid">VS</div>${side(b,1,'b','')}</div>
  <div class="act"><button class="btn alt" onclick="openEdit('${m.id}')">✏️ Edit</button></div></div>`;
  if(ctx==='res'){
    const big=s2=>`<div class="sc">${S.bestOf===3?w[s2]:g[s2]}</div>`;
    return `<div class="m">${head}<div class="vs">${side(a,0,'a',big(0))}<div class="mid">VS</div>${side(b,1,'b',big(1))}</div>${chips(true)}
    <div class="act"><button class="btn alt" onclick="openEdit('${m.id}')">✏️ Edit match</button></div></div>`;
  }
  const ctl=(s2)=>(m.done||between)?'':`<div class="ctl"><button onclick="score('${m.id}',${s2},-1)" aria-label="minus">−</button><button class="p" onclick="score('${m.id}',${s2},1)" aria-label="plus">+</button></div>`;
  const big=s2=>`<div class="sc ${g[s2]===0||g[s2]>=13?'word':''}">${pt(g[s2])}</div>${ctl(s2)}`;
  let banner='';
  if(m.done)banner=`<div class="won">🏆 ${esc(T(m.winner).name)} wins ${S.bestOf===3?'the match '+w[0]+'-'+w[1]:g[0]+'–'+g[1]}</div><div class="act"><button class="btn alt" onclick="undoLast('${m.id}')">↩ Undo last point</button></div>`;
  else if(between){const wn=gwin(g)===0?a:b;banner=`<div class="won">Game ${n} won by ${esc(wn.name)} (${g[0]}–${g[1]})</div><div class="act"><button class="btn" onclick="startNext('${m.id}')">▶ Start Game ${n+1}</button><button class="btn alt" onclick="undoLast('${m.id}')">↩ Undo last point</button></div>`}
  return `<div class="m ${live&&!m.done?'live':''}">${head}${S.bestOf===3&&!m.done?`<div class="gl"><b>Game ${n}</b></div>`:''}
  <div class="vs">${side(a,0,'a',big(0))}<div class="mid">VS</div>${side(b,1,'b',big(1))}</div>${chips(false)}${banner}
  <div class="act"><button class="btn alt" onclick="openEdit('${m.id}')">✏️ Edit match</button>${started&&!m.done?`<button class="btn del" onclick="resetMatch('${m.id}')">Clear scores</button>`:''}</div></div>`;
}
function startNext(id){const m=S.matches.find(x=>x.id===id);if(m){m.games.push([0,0]);save();render()}}
function undoLast(id){
  const m=S.matches.find(x=>x.id===id);if(!m)return;
  if(m.done){reopen(id);return}
  undoGame(m.games[m.games.length-1]);
  save();render();
}
function nextMatch(){S.lastDone=null;tab='upcoming';save();render();window.scrollTo(0,0)}
function upNext(){return S.matches.find(x=>!x.done&&!x.bye&&!x.confirmed&&!x.games.some(g=>g[0]+g[1]>0))}
const noFix=`<div class="card empty">No fixtures yet. Go to Teams, add the teams, pick League or Knockout, then press Shuffle &amp; start.</div>`;
function groupList(ms,ctx){
  let h='';
  if(S.mode==='knockout'){
    [...new Set(ms.map(m=>m.round))].sort((a,b)=>b-a).forEach(r=>{h+=`<h3>${roundName(r)}</h3>`+ms.filter(m=>m.round===r).map(m=>card(m,ctx)).join('')});
    return h;
  }
  const fin=ms.filter(m=>m.po==='final'),sf=ms.filter(m=>m.po==='semi'),lg=ms.filter(m=>!m.po);
  if(fin.length)h+=`<h3>Final</h3>`+fin.map(m=>card(m,ctx)).join('');
  if(sf.length)h+=`<h3>Semi-finals</h3>`+sf.map(m=>card(m,ctx)).join('');
  if(lg.length)h+=`<h3>League matches (${lg.length})</h3>`+lg.map(m=>card(m,ctx)).join('');
  return h;
}
function vScore(){
  if(!S.started)return noFix;
  const live=S.matches.filter(m=>!m.done&&!m.bye&&(m.confirmed||m.games.some(g=>g[0]+g[1]>0)));
  const jd=S.matches.find(m=>m.id===S.lastDone&&m.done);
  let h=prizeBanner()+`<p class="note">Points: Love (0), 1 to 12, Hope (13), Game (14). A team wins the game at 14. If one team is on Love and the other reaches 7, that team wins too.</p>`;
  if(jd)h+=`<h3>Just finished</h3>`+card(jd,'score')+`<div class="row" style="margin-bottom:12px"><button class="btn" onclick="nextMatch()">Next match →</button></div>`;
  h+=live.length?`<h3>Live matches (${live.length})</h3>`+live.map(m=>card(m,'score')).join(''):`<div class="card empty">No match is being scored right now.<br><br><button class="btn" onclick="nextMatch()">Go to upcoming matches</button></div>`;
  return h;
}
function vUpcoming(){
  if(!S.started)return noFix;
  const nx=upNext();
  const lv=S.matches.find(m=>!m.done&&!m.bye&&(m.confirmed||m.games.some(g=>g[0]+g[1]>0)));
  const up=S.matches.filter(m=>!m.done&&!m.bye&&!m.confirmed&&!m.games.some(g=>g[0]+g[1]>0)&&(lv||!nx||m.id!==nx.id));
  let h=(lv?liveBar(lv):nextBar())+`<div class="row" style="margin-bottom:12px"><button class="btn alt" onclick="goAdd()">＋ Add late team</button><button class="btn alt" onclick="openEdit(null)">＋ Add match</button></div>`;
  if(S.mode==='league'){
    if(S.matches.some(m=>m.po))h+=`<div class="row" style="margin-bottom:12px"><button class="btn alt" onclick="redoPlayoffs()">🔄 Re-pick Semi-final from points table</button></div>`;
    else if(S.playoff!==false&&S.teams.length>=3)h+=`<p class="note">When all league matches are finished, the Semi-finals (1st vs 4th, 2nd vs 3rd) and the Final are picked automatically from the points table. You can also use the Move to Semi-final button under the Points table.</p>`;
  }else h+=`<p class="note">Knockout: lose and you are out. Winners move to the next round automatically.</p>`;
  h+=up.length?`<h3>Upcoming matches (${up.length})</h3>`+groupList(up,'up'):(nx&&!lv?'':`<div class="card empty">No upcoming matches. Check Score for live matches and Results for finished ones.</div>`);
  return h;
}
function vResults(){
  if(!S.started)return noFix;
  const dn=S.matches.filter(m=>m.done);
  return prizeBanner()+(dn.length?groupList(dn,'res'):`<div class="card empty">No finished matches yet.</div>`);
}
function vTable(){
  if(!S.teams.length)return`<div class="card empty">Add teams to see the points table.</div>`;
  const rows=standings().map((x,i)=>`<tr><td>${i+1}</td><td class="l"><b>${esc(x.t.name)}</b>${x.t.out?' <span class="tag">Withdrawn</span>':''}<div class="note" style="margin:0">${esc(x.t.p1)} &amp; ${esc(x.t.p2)}</div></td>
  <td>${x.P}</td><td>${x.W}</td><td>${x.L}</td><td>${x.PF}</td><td>${x.PA}</td>
  <td class="${x.PD>=0?'pos':'neg'}">${x.PD>0?'+':''}${x.PD}</td><td class="${x.RR>=0?'pos':'neg'}">${x.RR>0?'+':''}${x.RR.toFixed(2)}</td><td><input class="adj" type="number" value="${x.t.adj||0}" onchange="setAdj('${x.t.id}',this.value)"></td><td><b>${x.Pts}</b></td></tr>`).join('');
  return prizeBanner()+`<div class="card"><h2>Points table</h2><div class="tw"><table><thead><tr><th>#</th><th class="l">Team</th><th>Played</th><th>Won</th><th>Lost</th><th>Pts For</th><th>Pts Against</th><th>Diff</th><th>Run Rate</th><th>Adjust</th><th>Points</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note">Win = 2 points. Run Rate = (points scored − points conceded) ÷ games played. Ranking: Points, then Run Rate, then Diff. Only completed league matches count (semi-final and final are not included). Adjust = manual points to add or remove (for example −1 for a penalty).</p>${semiBtn()}</div>`;
}
function render(){
  const tt=document.getElementById('ttl');if(tt)tt.textContent='🏸 '+(S.title||'Badminton Tournament Scorer');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  document.getElementById('app').innerHTML=tab==='teams'?vTeams():tab==='score'?vScore():tab==='upcoming'?vUpcoming():tab==='results'?vResults():vTable();
}
document.getElementById('nav').addEventListener('click',e=>{const bt=e.target.closest('button'),t=bt&&bt.dataset.t;if(t){tab=t;render();window.scrollTo(0,0)}});
render();
if(S.started)document.getElementById('modal').hidden=false;
</script>
</body>
</html>
